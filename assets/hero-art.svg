<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 620" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Abstract blue glass sculpture</title><desc id="desc">A balanced composition of diagonal glass ribbons and floating facets with soft blue light, without a circular frame.</desc>
<defs>
 <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(235 -9 11 190 331 309)" gradientUnits="userSpaceOnUse"><stop stop-color="#367BEA" stop-opacity=".40"/><stop offset="1" stop-color="#07101D" stop-opacity="0"/></radialGradient>
 <linearGradient id="glassA" x1="120" y1="112" x2="440" y2="515" gradientUnits="userSpaceOnUse"><stop stop-color="#F3FAFF" stop-opacity=".91"/><stop offset=".26" stop-color="#8FCBFF" stop-opacity=".45"/><stop offset=".62" stop-color="#3977E7" stop-opacity=".16"/><stop offset="1" stop-color="#92E4FF" stop-opacity=".8"/></linearGradient>
 <linearGradient id="glassB" x1="270" y1="80" x2="460" y2="540" gradientUnits="userSpaceOnUse"><stop stop-color="#C9EBFF" stop-opacity=".89"/><stop offset=".38" stop-color="#5E9EFF" stop-opacity=".2"/><stop offset=".76" stop-color="#3048B9" stop-opacity=".72"/><stop offset="1" stop-color="#A8D7FF" stop-opacity=".25"/></linearGradient>
 <linearGradient id="glassC" x1="90" y1="250" x2="500" y2="400" gradientUnits="userSpaceOnUse"><stop stop-color="#A1D9FF" stop-opacity=".7"/><stop offset=".52" stop-color="#537FF0" stop-opacity=".28"/><stop offset="1" stop-color="#E0F5FF" stop-opacity=".76"/></linearGradient>
 <linearGradient id="edge" x1="164" y1="145" x2="465" y2="486" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF" stop-opacity=".9"/><stop offset=".52" stop-color="#9EDBFF" stop-opacity=".76"/><stop offset="1" stop-color="#6F9EFF" stop-opacity=".76"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="17"/></filter>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#B9DCFF" stroke-opacity=".10" stroke-width=".7"/></pattern>
</defs>
<!-- Atmospheric light is elliptical and diffuse, not a giant circular frame. -->
<!-- Main free-flowing glass ribbon: deliberately open, with no closed loop. -->
<path d="M142 164C205 112 285 133 302 203C318 267 260 302 255 362C250 418 302 464 359 457C395 453 421 429 442 398" stroke="url(#glassA)" stroke-width="54" stroke-linecap="round" opacity=".77"/>
<path d="M142 164C205 112 285 133 302 203C318 267 260 302 255 362C250 418 302 464 359 457C395 453 421 429 442 398" stroke="#EAF7FF" stroke-opacity=".8" stroke-width="1.4"/>
<path d="M327 105C370 132 392 171 380 208C367 247 330 267 319 305C307 344 326 378 354 403C381 427 389 453 373 477C351 511 310 515 276 495" stroke="url(#glassB)" stroke-width="35" stroke-linecap="round" opacity=".76"/>
<path d="M327 105C370 132 392 171 380 208C367 247 330 267 319 305C307 344 326 378 354 403C381 427 389 453 373 477C351 511 310 515 276 495" stroke="#D8F0FF" stroke-opacity=".72" stroke-width="1.2"/>
<!-- Separate crystalline facets add structure without forming a ring. -->
<path d="M430 156L492 192L507 252L461 282L415 239Z" fill="url(#glassB)" fill-opacity=".52" stroke="#DCEFFF" stroke-opacity=".82" stroke-width="1.5"/>
<path d="M430 156L461 282L492 192" stroke="#E6F6FF" stroke-opacity=".76"/>
<path d="M115 289L185 250L224 292L194 343L130 335Z" fill="url(#glassC)" fill-opacity=".44" stroke="#BBDFFF" stroke-opacity=".86" stroke-width="1.4"/>
<path d="M115 289L194 343L185 250" stroke="#E4F3FF" stroke-opacity=".72"/>
<path d="M460 344L511 365L523 412L486 440L448 405Z" fill="url(#glassC)" fill-opacity=".32" stroke="#C4E9FF" stroke-opacity=".72" stroke-width="1.3"/>
<path d="M460 344L486 440L511 365" stroke="#E6F7FF" stroke-opacity=".65"/>
<path d="M170 431L204 410L232 438L212 466L178 461Z" fill="#6EA7FF" fill-opacity=".23" stroke="#B4DAFF" stroke-opacity=".8" stroke-width="1.3"/>
<circle cx="124" cy="190" r="4" fill="#BFEAFF"/><circle cx="498" cy="141" r="4" fill="#83B7FF"/><circle cx="424" cy="492" r="3.5" fill="#D9F3FF"/>
<path d="M520 104L525 117L538 122L525 127L520 140L515 127L502 122L515 117Z" fill="#E2F6FF" opacity=".92"/>
